<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Task Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 id="main-heading">📚 Student Task Management System</h1>
        <form id="task-form">
            <input type="text" id="task-title" placeholder="Task Title">
            <input type="text" id="task-desc" placeholder="Task Description">
            <select id="priority">
                <option value="High">High</option>
                <option value="Medium" selected>Medium</option>
                <option value="Low">Low</option>
            </select>
            <button type="submit">Add Task</button>
        </form>
        <div id="error-msg" class="error hidden">Please enter both a title and a description.</div>
        <ul id="task-list">
            <li>Complete DevOps Assignment</li>
            <li>Prepare for Database Quiz</li>
            <li>Submit Web Lab Report</li>
        </ul>
    </div>
    <script src="script.js"></script>
</body>
</html>
